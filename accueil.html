<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Accueil</title>
<style>body{background:linear-gradient(135deg,#ff9a9e,#a18cd1);font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:white;padding:30px;border-radius:15px;width:320px;text-align:center}button{width:100%;padding:12px;background:#ff5e8a;color:white;border:none;border-radius:8px;margin-top:10px;cursor:pointer}</style>
</head>
<body>
<div class="card">
<h2 id="titre">Bienvenue !</h2>
<p>Tu es bien connectée, bravo ! 🎉</p>
<p>Projet de <b>Nfanga Gaëlle</b> et <b>Emmanuel</b></p>
<button onclick="window.location.href='index.html'">Se déconnecter</button>
</div>
<script>
const nom = new URLSearchParams(window.location.search).get("nom");
if(nom){ document.getElementById("titre").textContent = "Bienvenue " + nom + " !"; }
</script>
</body>
</html>
