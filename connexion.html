<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Connexion</title>
<style>body{background:linear-gradient(135deg,#ff9a9e,#a18cd1);font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:white;padding:30px;border-radius:15px;width:320px;text-align:center}input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}button{width:100%;padding:12px;background:#ff5e8a;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}a{color:#ff5e8a;text-decoration:none}</style>
</head>
<body>
<div class="card">
<h2>Connexion</h2>
<input type="text" id="username" placeholder="Nom d'utilisateur">
<input type="password" id="password" placeholder="Mot de passe">
<button onclick="connecter()">Se connecter</button>
<p id="message"></p>
<p>Pas de compte ? <a href="index.html">S'inscrire</a></p>
</div>
<script>
const SUPABASE_URL = "https://xnydshxchpfjuyqsvgv.supabase.co";
const SUPABASE_KEY = "sb_publishable_A7j0QW8H021_zeKcw3yUyA_8J1LZpZq";
async function connecter(){
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;
  const msg=document.getElementById("message");
  const vrai = localStorage.getItem("user_"+username);
  if(vrai === null){msg.textContent="Ce compte n'existe pas, inscris-toi d'abord !"; return;}
  if(vrai !== password){msg.textContent="Mot de passe faux !"; return;}
  msg.textContent="Bienvenue "+username+" !";
  setTimeout(()=>{window.location.href="accueil.html?nom="+username;},1000);
}
</script>
</body>
</html>
